services:
  db:
    image: postgres:16-alpine
    container_name: eve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eve_healthcare_db}
      POSTGRES_USER: ${DB_USER:-eve_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eve_secure_password_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eve_user} -d ${DB_NAME:-eve_healthcare_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: eve_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-eve-healthcare-dev-key-!#99x-change-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-eve_healthcare_db}
      - DB_USER=${DB_USER:-eve_user}
      - DB_PASSWORD=${DB_PASSWORD:-eve_secure_password_dev}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - USE_SQLITE=False
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-dev_shared_webhook_secret_key_eve_healthcare_2026}
      - WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS=${WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
            python manage.py seed_demo_data &&
            python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
