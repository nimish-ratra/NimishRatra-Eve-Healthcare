name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eve_healthcare_db
          POSTGRES_USER: eve_user
          POSTGRES_PASSWORD: eve_secure_password_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Checks
        run: |
          ruff check .

      - name: Check for Missing Migrations
        env:
          USE_SQLITE: "True"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Test Suite against PostgreSQL
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: eve_healthcare_db
          DB_USER: eve_user
          DB_PASSWORD: eve_secure_password_dev
          DB_HOST: localhost
          DB_PORT: 5432
          USE_SQLITE: "False"
          WEBHOOK_SECRET: dev_shared_webhook_secret_key_eve_healthcare_2026
          SECRET_KEY: ci-test-secret-key-!#99x
        run: |
          pytest --cov=. --cov-report=term-missing

      - name: Validate OpenAPI Schema Generation
        env:
          USE_SQLITE: "True"
        run: |
          python manage.py spectacular --validate --fail-on-warn

      - name: Build Docker Image
        run: |
          docker build -t eve-healthcare-backend:ci .
